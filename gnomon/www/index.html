<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Gnomon</title>
<style>
:root {
  /* type scale — argus/design/tokens.css, exact px */
  --fs-micro: 10px;   --fs-label: 11px;  --fs-caption: 11.5px;
  --fs-note: 12px;    --fs-small: 12.5px; --fs-body-dense: 13px;
  --fs-body: 14px;    --fs-emph: 15px;   --fs-title: 16px;
  --fs-panel: 19px;   --fs-num: 20px;    --fs-bignum: 34px;

  --track-caps: .08em;
  --track-tight: -.02em;

  --r-bar: 2px;  --r-xs: 6px;  --r-sm: 8px;  --r-md: 12px;
  --r-lg: 16px;  --r-xl: 20px; --r-2xl: 24px; --r-pill: 999px;

  --ease-lift: cubic-bezier(.2, .8, .2, 1);
  --t-lift: 200ms;
  --lift-y: -2px;

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
             system-ui, sans-serif;

  /* ---------- NIGHT · Halo ---------- */
  --ground: radial-gradient(120% 140% at 20% 0%, #182030 0%, #0e1219 55%, #0a0c10 100%);
  --bg: #0b0d10;
  --surface: rgba(255, 255, 255, .045);
  --surface-hi: rgba(255, 255, 255, .09);
  --border: rgba(255, 255, 255, .08);
  --blur: blur(20px) saturate(160%);
  --shadow-card: none;

  --text: #e8eaee;
  --text-2: #9aa3b2;
  --text-3: #6d7684;
  --track: rgba(255, 255, 255, .08);

  --ok: #34c759;
  --warn: #febc2e;
  --crit: #e5484d;
  --run: #4c8dff;
  --stale-c: #6d7684;
  --unknown-c: rgba(109, 118, 132, .45);

  --dim-state: .55;
}

/* ---------- DAY · Daylight ---------- */
@media (prefers-color-scheme: light) {
  :root {
    --ground: #f4f5f7;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-hi: #fbfbfd;
    --border: rgba(0, 0, 0, .05);
    --blur: none;
    --shadow-card: 0 1px 2px rgba(15, 20, 30, .05), 0 8px 24px rgba(15, 20, 30, .06);

    --text: #16181d;
    --text-2: #59606c;
    --text-3: #7a8290;
    --track: #e6e9ee;

    --ok: #1f9d55;
    --warn: #8a6116;
    --crit: #b42328;
    --run: #1668e3;
    --stale-c: #7a8290;
    --unknown-c: rgba(122, 130, 144, .45);

    --dim-state: .82;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  background-image: var(--ground);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs-body);
  line-height: 1.45;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.wrap { max-width: 46rem; margin: 0 auto; padding: 1.25rem .875rem 3rem; }

/* ---------- header ---------- */

.top {
  display: flex;
  align-items: baseline;
  gap: .75rem;
  margin-bottom: .25rem;
}

h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0;
  flex: 1;
}

.synced {
  font-size: .6875rem;
  color: var(--text-3);
  letter-spacing: .01em;
}

button.refresh {
  font: inherit;
  font-size: .75rem;
  font-weight: 590;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 980px;
  padding: .3rem .75rem;
  cursor: pointer;
  transition: background .18s ease, opacity .18s ease;
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}
button.refresh:hover { background: var(--surface-hi); }
button.refresh:active { opacity: .6; }
button.refresh[disabled] { opacity: .4; cursor: default; }

/* ---------- summary ---------- */

#summary { margin: 1rem 0 1.1rem; }

.summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: .85rem .9rem .8rem;
  box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: var(--blur);
  backdrop-filter: var(--blur);
}

.sumrow { display: flex; gap: .9rem; align-items: center; }
.sumtext { min-width: 0; }

.sumtext .hdr {
  font-size: var(--fs-micro);
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  color: var(--text-3);
}
.sumtext .big {
  font-size: var(--fs-num);
  font-weight: 640;
  letter-spacing: var(--track-tight);
  margin-top: .15rem;
}
.sumtext .sub {
  font-size: var(--fs-caption);
  color: var(--text-2);
  margin-top: .1rem;
}

.ring { flex: none; }
.ring-track { stroke: var(--track); }
.ring-fill { stroke: var(--ok); }

.stakes { display: flex; height: 5px; border-radius: var(--r-bar); overflow: hidden; margin: .75rem 0 .4rem; }
.stakes i { display: block; }
.stakekey {
  display: flex; gap: .7rem;
  font-size: var(--fs-micro);
  text-transform: uppercase;
  letter-spacing: var(--track-caps);
  color: var(--text-3);
}

/* ---------- card ---------- */

.card {
  --accent: var(--text-3);
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: .875rem .9rem .8rem;
  margin-bottom: .5rem;
  cursor: pointer;
  overflow: hidden;
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  backdrop-filter: blur(24px) saturate(150%);
  box-shadow: var(--shadow-card);
  transition: background .2s ease, opacity .25s ease;
  animation: rise .32s cubic-bezier(.22, .9, .3, 1) both;
}

.card:hover { background: var(--surface-hi); }

.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  opacity: .85;
}

.card[data-state="stale"], .card[data-state="parked"] { opacity: var(--dim-state); }
.card[data-state="stale"]:hover, .card[data-state="parked"]:hover { opacity: .8; }

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.card[data-state="stale"], .card[data-state="parked"] { animation-name: rise-dim; }
@keyframes rise-dim {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: var(--dim-state); transform: none; }
}

.card.hero { padding: 1.1rem 1rem 1rem; margin-bottom: .6rem; }
.card.hero .project { font-size: .875rem; font-weight: 590; color: var(--text-2); }
.card.hero .hero-next {
  font-size: 1.3125rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.02em;
  margin: .1rem 0;
}
.card.hero .hero-next.empty {
  font-size: 1rem;
  font-weight: 400;
  color: var(--text-3);
  font-style: italic;
}
.card.hero .prog { margin: .5rem 0 .7rem; }

.badge {
  margin-left: auto;
  flex: none;
  font-size: .5938rem;
  font-weight: 600;
  letter-spacing: .07em;
  color: var(--accent);
  border: 1px solid currentColor;
  border-radius: 980px;
  padding: .1rem .4rem;
}

.card.rescue { margin-bottom: .7rem; }
.rescue-tag {
  font-size: .5625rem;
  font-weight: 600;
  letter-spacing: .09em;
  color: var(--accent);
  margin-bottom: .3rem;
}
.card.rescue .project { font-size: .9375rem; }
.card.rescue .age { margin-left: auto; }
.card.rescue .next { font-size: .875rem; color: var(--text-2); margin-top: .2rem; }

.card.tail { padding: .7rem .9rem .6rem; margin-bottom: .35rem; }
.card.tail .project { font-size: .875rem; font-weight: 500; }
.card.tail .count { margin-left: .4rem; }
.card.tail .segs { margin-top: .45rem; }

.row1 { display: flex; align-items: baseline; gap: .5rem; }

.project {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -.01em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.age {
  flex: none;
  font-size: .6875rem;
  color: var(--text-3);
  letter-spacing: -.01em;
}

.why {
  margin-top: .6rem;
  padding-top: .6rem;
  border-top: 1px solid var(--border);
  font-size: .625rem;
  line-height: 1.6;
  color: var(--text-3);
  letter-spacing: -.01em;
}

.pace { font-size: var(--fs-caption); line-height: 1; flex: none; }
.pace.up { color: var(--ok); }
.pace.down { color: var(--crit); }

.actbar {
  height: 4px;
  border-radius: var(--r-bar);
  background: var(--track);
  overflow: hidden;
  flex: 1;
  min-width: 0;
}
.actbar i { display: block; height: 100%; border-radius: var(--r-bar); background: var(--accent); }

.card.tail .actbar { margin: 0 .1rem; }

/* ---------- progress ---------- */

.prog { display: flex; align-items: center; gap: .5rem; margin: .55rem 0 .5rem; }

.segs { display: flex; gap: 2px; flex: 1; min-width: 0; }

.seg {
  height: 3px;
  flex: 1;
  border-radius: 2px;
  background: var(--track);
}
.seg.done { background: var(--accent); }
.seg.current { background: var(--accent); opacity: .5; }

.count {
  flex: none;
  font-size: .625rem;
  color: var(--text-3);
  letter-spacing: -.01em;
}

/* ---------- current step ---------- */

.next {
  font-size: .96875rem;
  line-height: 1.35;
  letter-spacing: -.005em;
}

/* ---------- meta ---------- */

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-top: .5rem;
  font-size: .5938rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text-3);
}
.meta i { font-style: normal; opacity: .45; }

/* ---------- blocker ---------- */

.blocker {
  margin-top: .625rem;
  padding-top: .625rem;
  border-top: 1px solid var(--border);
  display: flex;
  gap: .45rem;
  align-items: flex-start;
  color: var(--crit);
  font-size: .8125rem;
  line-height: 1.35;
}

.blocker b {
  font-size: .5625rem;
  font-weight: 600;
  letter-spacing: .08em;
  border: 1px solid currentColor;
  border-radius: 980px;
  padding: .05rem .3rem;
  flex: none;
  margin-top: .1rem;
}

/* ---------- expanded step list ---------- */

.steps {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .3s cubic-bezier(.22, .9, .3, 1);
}
.card.open .steps { grid-template-rows: 1fr; }

.steps-inner { overflow: hidden; min-height: 0; }

.steps ol {
  list-style: none;
  margin: .7rem 0 0;
  padding: .7rem 0 0;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}

.steps li {
  display: flex;
  gap: .5rem;
  align-items: flex-start;
  font-size: .8125rem;
  line-height: 1.35;
  color: var(--text-3);
}

.steps li .mark {
  flex: none;
  width: .75rem;
  text-align: center;
  font-size: .6875rem;
  line-height: 1.5;
}

.steps li.done .mark { color: var(--text-2); }
.steps li.current { color: var(--text); }
.steps li.current .mark { color: var(--accent); }
.steps li.todo .mark { color: var(--text-3); opacity: .6; }

/* ---------- notices ---------- */

.note {
  margin-top: .45rem;
  font-size: .6875rem;
  color: var(--text-3);
  font-style: italic;
}

.empty-state, .error {
  text-align: center;
  color: var(--text-2);
  padding: 3rem 1rem;
  font-size: .875rem;
}
.error { color: var(--crit); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Gnomon</h1>
    <span class="synced" id="synced"></span>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </div>

  <div id="summary"></div>

  <div id="board"><div class="empty-state">Loading…</div></div>
</div>

<script>
(function () {
  "use strict";

  var ACCENT = {
    blocked: "var(--crit)",
    stale:   "var(--stale-c)",
    aging:   "var(--warn)",
    fresh:   "var(--ok)",
    parked:  "var(--run)",
    unknown: "var(--unknown-c)"
  };

  var board   = document.getElementById("board");
  var refresh = document.getElementById("refresh");
  var open    = Object.create(null);   // repo -> expanded, in memory only
  var timer   = null;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null && text !== "") node.textContent = text;
    return node;
  }

  function accent(c) {
    return ACCENT[c.state] || ACCENT.unknown;
  }

  function activityLabel(c) {
    if (c.momentum === null || c.momentum === undefined) return "unknown";
    if (c.commits_7d) return c.commits_7d + "/wk";
    if (c.commits_30d) return c.commits_30d + "/mo";
    return "quiet";
  }

  var PACE_WINDOW = 4.3;      // weeks in the 30-day window
  var PACE_FLOOR = 10;        // below this many monthly commits, say nothing
  var PACE_UP = 1.25;
  var PACE_DOWN = 0.6;

  // Direction of travel without storing history: this week against the
  // month's weekly average. Silent below the floor, where the ratio is noise.
  function pace(c) {
    if (typeof c.commits_7d !== "number") return "";
    if (typeof c.commits_30d !== "number" || c.commits_30d < PACE_FLOOR) return "";
    var ratio = c.commits_7d / (c.commits_30d / PACE_WINDOW);
    if (ratio >= PACE_UP) return "up";
    if (ratio <= PACE_DOWN) return "down";
    return "";
  }

  function paceGlyph(c) {
    var dir = pace(c);
    if (!dir) return null;
    return el("span", "pace " + dir, dir === "up" ? "↑" : "↓");
  }

  function maxCommits(cards) {
    return cards.reduce(function (m, c) {
      return typeof c.commits_7d === "number" && c.commits_7d > m ? c.commits_7d : m;
    }, 0);
  }

  function activityBar(c, max) {
    if (!max || typeof c.commits_7d !== "number" || c.commits_7d <= 0) return null;
    var bar = el("div", "actbar");
    var fill = el("i");
    fill.style.setProperty("width", Math.round(100 * c.commits_7d / max) + "%");
    bar.appendChild(fill);
    return bar;
  }

  function cardShell(c, className) {
    var card = el("article", className);
    card.setAttribute("data-state", c.state);
    card.setAttribute("data-repo", c.repo);
    card.style.setProperty("--accent", accent(c));
    if (open[c.repo]) card.classList.add("open");
    return card;
  }

  function metaRow(parts) {
    var row = el("div", "meta");
    parts.filter(Boolean).forEach(function (part, i) {
      if (i) row.appendChild(el("i", null, "·"));
      row.appendChild(el("span", null, part));
    });
    return row;
  }

  function blockerBlock(c) {
    if (!c.blocker) return null;
    var wrap = el("div", "blocker");
    wrap.appendChild(el("b", null, "BLOCKED"));
    wrap.appendChild(el("span", null, c.blocker));
    return wrap;
  }

  function segments(c) {
    if (!c.steps_total) return null;
    var segs = el("div", "segs");
    c.steps.forEach(function (s) {
      var cls = "seg";
      if (s.state === "done") cls += " done";
      else if (s.state === "current") cls += " current";
      segs.appendChild(el("div", cls));
    });
    return segs;
  }

  function progressRow(c) {
    var segs = segments(c);
    if (!segs) return null;
    var row = el("div", "prog");
    row.appendChild(segs);
    row.appendChild(el("span", "count", c.steps_done + " / " + c.steps_total));
    return row;
  }

  function stepList(c) {
    if (!c.steps || !c.steps.length) return null;
    var list = el("ol");
    c.steps.forEach(function (s) {
      var item = el("li", s.state);
      var mark = s.state === "done" ? "✓" : (s.state === "current" ? "●" : "○");
      item.appendChild(el("span", "mark", mark));
      item.appendChild(el("span", null, s.text));
      list.appendChild(item);
    });
    return list;
  }

  function detailBlock(c) {
    var steps = stepList(c);
    // Composed by ranking.why_line, which drops a debt_reason that would only
    // restate what the rank explanation already said.
    var reason = c.why || "";
    if (!steps && !reason) return null;
    var wrap = el("div", "steps");
    var inner = el("div", "steps-inner");
    if (steps) inner.appendChild(steps);
    if (reason) inner.appendChild(el("div", "why", reason));
    wrap.appendChild(inner);
    return wrap;
  }

  function addIf(parent, child) {
    if (child) parent.appendChild(child);
  }

  var SVG_NS = "http://www.w3.org/2000/svg";
  var RING_C = 251.3;
  var STAKES_ORDER = ["revenue", "product", "personal"];

  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  // Argus ring geometry: viewBox 92, r=40, stroke=8, circumference 251.3,
  // rotated -90 so it starts at twelve o'clock.
  function completionRing(done, total) {
    if (!total) return null;
    var pct = Math.round(100 * done / total);
    var offset = Math.round(RING_C * (1 - done / total) * 100) / 100;
    var svg = svgEl("svg", {
      "class": "ring", width: "76", height: "76", viewBox: "0 0 92 92",
      "aria-label": pct + " percent complete"
    });
    svg.appendChild(svgEl("circle", {
      "class": "ring-track", cx: "46", cy: "46", r: "40",
      fill: "none", "stroke-width": "8"
    }));
    svg.appendChild(svgEl("circle", {
      "class": "ring-fill", cx: "46", cy: "46", r: "40",
      fill: "none", "stroke-width": "8", "stroke-linecap": "round",
      "stroke-dasharray": String(RING_C),
      "stroke-dashoffset": String(offset),
      transform: "rotate(-90 46 46)"
    }));
    return svg;
  }

  function idleCount(cards) {
    return cards.filter(function (c) {
      return c.next && typeof c.commits_7d === "number" && c.commits_7d <= 2;
    }).length;
  }

  function summaryLine(cards) {
    var done = 0, total = 0, blocked = 0, stale = 0;
    cards.forEach(function (c) {
      done += c.steps_done || 0;
      total += c.steps_total || 0;
      if (c.state === "blocked") blocked++;
      if (c.state === "stale") stale++;
    });
    var idle = idleCount(cards);
    var parts = [];
    if (total) parts.push(done + " of " + total + " steps · " + Math.round(100 * done / total) + "%");
    if (idle) parts.push(idle + " idle");
    if (blocked) parts.push(blocked + " blocked");
    if (stale) parts.push(stale + " stale");
    return parts.join(" · ");
  }

  function weekTotal(cards) {
    return cards.reduce(function (n, c) {
      return n + (typeof c.commits_7d === "number" ? c.commits_7d : 0);
    }, 0);
  }

  function stakesBar(cards) {
    var by = { revenue: 0, product: 0, personal: 0 };
    var total = 0;
    cards.forEach(function (c) {
      if (typeof c.commits_7d !== "number") return;
      var key = by.hasOwnProperty(c.stakes) ? c.stakes : "personal";
      by[key] += c.commits_7d;
      total += c.commits_7d;
    });
    if (!total) return null;
    var wrap = el("div");
    var bar = el("div", "stakes");
    var key = el("div", "stakekey");
    var tone = { revenue: "var(--ok)", product: "var(--run)", personal: "var(--stale-c)" };
    STAKES_ORDER.forEach(function (k) {
      var pct = Math.round(100 * by[k] / total);
      var seg = el("i");
      seg.style.setProperty("width", pct + "%");
      seg.style.setProperty("background", tone[k]);
      bar.appendChild(seg);
      key.appendChild(el("span", null, pct + "% " + k));
    });
    wrap.appendChild(bar);
    wrap.appendChild(key);
    return wrap;
  }

  function heroCard(c) {
    var card = cardShell(c, "card hero");
    var row = el("div", "row1");
    row.appendChild(el("span", "project", c.project));
    // order_badge can be "" when every repo's metadata call failed; an empty
    // badge span would still draw its border, so it's only added when there
    // is text to show.
    if (c.order_badge) row.appendChild(el("span", "badge", c.order_badge));
    card.appendChild(row);

    addIf(card, progressRow(c));
    card.appendChild(
      c.next ? el("div", "hero-next", c.next)
             : el("div", "hero-next empty", "Nothing in flight")
    );
    addIf(card, blockerBlock(c));
    var meta = metaRow([c.stakes, c.phase, activityLabel(c)]);
    addIf(meta, paceGlyph(c));
    card.appendChild(meta);
    addIf(card, c.note ? el("div", "note", c.note) : null);
    addIf(card, detailBlock(c));
    return card;
  }

  function rescueCard(c) {
    var card = cardShell(c, "card rescue");
    card.appendChild(el("div", "rescue-tag", "◈ NEEDS RESCUE"));
    var row = el("div", "row1");
    row.appendChild(el("span", "project", c.project));
    row.appendChild(el("span", "age", c.debt_reason));
    card.appendChild(row);
    if (c.next) card.appendChild(el("div", "next", c.next));
    addIf(card, blockerBlock(c));
    addIf(card, c.note ? el("div", "note", c.note) : null);
    addIf(card, detailBlock(c));
    return card;
  }

  function tailRow(c, max) {
    var card = cardShell(c, "card tail");
    var row = el("div", "row1");
    row.appendChild(el("span", "project", c.project));
    row.appendChild(el("span", "age", activityLabel(c)));
    addIf(row, paceGlyph(c));
    addIf(row, activityBar(c, max));
    row.appendChild(
      el("span", "count", c.steps_total ? c.steps_done + "/" + c.steps_total : "—")
    );
    card.appendChild(row);
    addIf(card, segments(c));
    addIf(card, blockerBlock(c));
    addIf(card, c.note ? el("div", "note", c.note) : null);
    addIf(card, detailBlock(c));
    return card;
  }

  function render(cards) {
    board.textContent = "";
    if (!cards.length) {
      board.appendChild(el("div", "empty-state", "No projects tracked yet."));
      return;
    }
    // Roles come from the backend. Emit hero first, then rescue, then every
    // remaining card in its existing order — a rescue picked precisely
    // because it sits below the fold must not render at its ordinal rank.
    var hero = cards.filter(function (c) { return c.role === "hero"; });
    var rescue = cards.filter(function (c) { return c.role === "rescue"; });
    var tail = cards.filter(function (c) { return c.role !== "hero" && c.role !== "rescue"; });
    var max = maxCommits(cards);
    hero.forEach(function (c) { board.appendChild(heroCard(c)); });
    rescue.forEach(function (c) { board.appendChild(rescueCard(c)); });
    tail.forEach(function (c) { board.appendChild(tailRow(c, max)); });
  }

  function renderSummary(cards) {
    var host = document.getElementById("summary");
    host.textContent = "";
    if (!cards.length) return;

    var done = 0, total = 0;
    cards.forEach(function (c) { done += c.steps_done || 0; total += c.steps_total || 0; });

    var panel = el("div", "summary");
    var row = el("div", "sumrow");
    addIf(row, completionRing(done, total));

    var text = el("div", "sumtext");
    text.appendChild(el("div", "hdr", "this week"));
    var known = cards.some(function (c) { return typeof c.commits_7d === "number"; });
    text.appendChild(el("div", "big", known ? weekTotal(cards) + " commits" : "activity unknown"));
    var line = summaryLine(cards);
    if (line) text.appendChild(el("div", "sub", line));
    row.appendChild(text);
    panel.appendChild(row);

    addIf(panel, stakesBar(cards));
    host.appendChild(panel);
  }

  function stamp(iso) {
    var el = document.getElementById("synced");
    if (!iso) { el.textContent = ""; return; }
    var d = new Date(iso);
    el.textContent = isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function load(force) {
    refresh.disabled = true;
    fetch(force ? "api/refresh" : "api/projects", {
      method: force ? "POST" : "GET",
      headers: { "Accept": "application/json" }
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var cards = data.projects || [];
        renderSummary(cards);
        render(cards);
        stamp(data.fetched);
        if (data.error) {
          var banner = document.createElement("div");
          banner.className = "error";
          banner.textContent = data.error;
          board.insertBefore(banner, board.firstChild);
        }
      })
      .catch(function (err) {
        renderSummary([]);
        board.textContent = "";
        var msg = document.createElement("div");
        msg.className = "error";
        msg.textContent = err.message;
        board.appendChild(msg);
      })
      .then(function () { refresh.disabled = false; });
  }

  board.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (!card) return;
    var repo = card.getAttribute("data-repo");
    open[repo] = !open[repo];
    card.classList.toggle("open", open[repo]);
  });

  refresh.addEventListener("click", function () { load(true); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load(false);
  });

  timer = setInterval(function () {
    if (!document.hidden) load(false);
  }, 120000);

  load(false);
})();
</script>
</body>
</html>
